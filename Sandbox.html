<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox</title>
    <link rel="stylesheet" href="Sandbox.css">

</head>

<body>
    <fieldset class="lg-fieldset">
        <legend class="lg-legend">
            <h2><b>Learning Goals</b></h2>
        </legend>
        <div class="lg-goal">
            <input type="checkbox"
                name="I will be able to define behavior and distinguish between innate behaviors and learned behaviors."
                id="I will be able to define behavior and distinguish between innate behaviors and learned behaviors.">
            <label class="lg-label"
                for="I will be able to define behavior and distinguish between innate behaviors and learned behaviors.">
                I will be able to define behavior and distinguish between innate behaviors and learned
                behaviors.</label>
        </div>
        <div class="lg-goal">
            <input type="checkbox"
                name="I will be able to identify stimulus and response, explaining how internal and external cues trigger specific behavioral patterns."
                id="I will be able to identify stimulus and response, explaining how internal and external cues trigger specific behavioral patterns.">
            <label class="lg-label"
                for="I will be able to identify stimulus and response, explaining how internal and external cues trigger specific behavioral patterns.">
                I will be able to identify stimulus and response, explaining how internal and external cues
                trigger specific behavioral patterns.</label>
        </div>
        <div class="lg-goal">
            <input type="checkbox" name="I will be able to describe the adaptive advantages of social behaviors."
                id="I will be able to describe the adaptive advantages of social behaviors.">
            <label class="lg-label" for="I will be able to describe the adaptive advantages of social behaviors.">
                I will be able to describe the adaptive advantages of social behaviors.</label>
        </div>
        <div class="lg-goal">
            <input type="checkbox" name="I will be able to explain different types of learning."
                id="I will be able to explain different types of learning.">
            <label class="lg-label" for="I will be able to explain different types of learning.">
                I will be able to explain different types of learning.</label>
        </div>
        <div class="lg-goal">
            <input type="checkbox"
                name="I will be able to analyze the costs and benefits of a specific behavior to determine its overall impact on an organism's fitness."
                id="I will be able to analyze the costs and benefits of a specific behavior to determine its overall impact on an organism's fitness.">
            <label class="lg-label"
                for="I will be able to analyze the costs and benefits of a specific behavior to determine its overall impact on an organism's fitness.">
                I will be able to analyze the costs and benefits of a specific behavior to determine its
                overall impact on an organism's fitness.</label>
        </div>
        <div class="lg-goal">
            <input type="checkbox" name="I will be able to evaluate the concept of kin selection and altruism."
                id="I will be able to evaluate the concept of kin selection and altruism.">
            <label for="I will be able to evaluate the concept of kin selection and altruism." class="lg-label">
                I will be able to evaluate the concept of kin selection and altruism.</label>
        </div>
    </fieldset>
    <section>
        <ul>
            <li>Hello</li>
            <li class="highlight">Hello</li>
            <li>Hello</li>
            <li>Hello</li>
            <li class="highlight">Hello</li>
            <li>Hello</li>
        </ul>
    </section>
    <script src="Sandbox.js"></script>
</body>

</html>
